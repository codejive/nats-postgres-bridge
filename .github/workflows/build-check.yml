name: Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  IMAGE_NAME: nats-postgres-bridge

jobs:
  build-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Node.js entrypoint syntax
        run: |
          node --check bridge.js
          node --check config.js
          node --check flatten.js
          node --check database.js
          node --check processor.js
          node --check errors.js

      - name: Run tests
        run: npm test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE_NAME }}:ci

      - name: Verify runtime modules in Docker image
        run: |
          docker build --tag "$IMAGE_NAME:smoke" .
          docker run --rm --entrypoint node "$IMAGE_NAME:smoke" -e "require('./bridge')"

